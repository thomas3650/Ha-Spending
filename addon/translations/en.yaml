configuration:
  firefly_url:
    name: Firefly III address
    description: >-
      Firefly III's address as the add-on reaches it, for example http://<firefly add-on host>:8080.
  firefly_token:
    name: Firefly III token
    description: >-
      A Personal Access Token from Firefly III. The add-on reads with it, and the sorter writes with it.
  firefly_link_url:
    name: Firefly III link address
    description: >-
      Firefly III's address as the browser reaches it. When set, a posting opens there in a new tab. When empty,
      postings are not links.
  main_group_rule_group:
    name: Main group rule group
    description: >-
      The Firefly III rule group whose rules put the categories into main groups.
  excluded_main_groups:
    name: Excluded main groups
    description: >-
      Main groups that are not spending, such as money moved in and out. Their postings are left out.
  sorter_key:
    name: Sorter key
    description: >-
      When set, the sorter's endpoint answers other add-ons on port 8100, to a request with this key. At least 32
      characters. When empty, the endpoint is off.
  sorter_inbox_category:
    name: Sorter inbox category
    description: >-
      The Firefly III category of the postings still to be sorted. The sorter takes postings from it and never puts
      one into it.
