name: Bug
description: Something in the add-on does not work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This repo is public. Never paste tokens, hostnames or real postings; use made-up data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Add-on version
      placeholder: 0.1.0
    validations:
      required: true
