<!doctype html>
<!-- Firefly III subscriptions on the page: three variants, ?v=a, b or c. Made-up numbers and names only. -->
<html lang="da">
<head>
<meta charset="utf-8">
<title>Abonnementer – tre udgaver</title>
<style>
:root{--bg:#f5f5f5;--side:#ffffff;--card:#ffffff;--line:#e3e3e3;--soft:#f0f0f0;--text:#1f1f1f;--muted:#6b6b6b;--accent:#03a9f4;--fixed:#0277bd;--var:#9fd8f7;--chip:#f1f1f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:56px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:18px}
.side i{display:block;width:22px;height:22px;border-radius:5px;background:#dcdcdc}
.side i.on{background:var(--accent)}
.main{flex:1;min-width:0}
.top{height:56px;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid var(--line);background:var(--side)}
.top b{font-size:20px;font-weight:400}
.page{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:16px}
.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.filters{display:flex;gap:12px;align-items:flex-start}
.sel{display:flex;flex-direction:column;min-width:190px;padding:6px 36px 6px 12px;border:1px solid #c9c9c9;border-radius:8px;background:#fff;position:relative}
.sel small{color:var(--muted);font-size:11px}
.sel:after{content:"▾";position:absolute;right:12px;top:14px;color:var(--muted)}
.crumbs{font-size:16px;font-weight:600}
.seg{display:inline-flex;border:1px solid #c9c9c9;border-radius:8px;overflow:hidden;font-size:13px}
.seg span{padding:6px 14px;color:var(--text)}
.seg span.on{background:var(--accent);color:#fff;font-weight:600}
h2{margin:0 0 12px;font-size:16px;font-weight:500;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2 small{color:var(--muted);font-weight:400;font-size:13px}
.foot{color:var(--muted);font-size:12px;margin-top:8px}
.label{color:var(--muted);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpis.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi .v{font-size:26px;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.kpi.new{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;color:var(--muted);font-weight:400;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--soft)}
td.r,th.r{text-align:right}
td .sub{display:block;color:var(--muted);font-size:12px}
.st{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;white-space:nowrap}
.st.ok{background:#e3f4ea;color:#1b6e3c}
.st.due{background:#eef3f8;color:#3b5b7a}
.st.miss{background:#fdecea;color:#b3261e}
.st.up{background:#fff3e0;color:#a85a00}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.hb{display:grid;grid-template-columns:170px 1fr 150px;gap:12px;align-items:center;padding:7px 4px}
.hb .track{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--soft)}
.hb .amt{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.hb .amt small{display:block;color:var(--muted);font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{color:var(--muted);font-size:12px;text-align:center;padding:4px 0}
.cal .d{min-height:74px;border:1px solid var(--soft);border-radius:8px;padding:5px 6px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.cal .d.out{background:#fafafa;color:#bdbdbd}
.cal .d.today{border-color:var(--accent)}
.cal .d .n{color:var(--muted)}
.cal .pay{background:#e1f3fd;color:#01579b;border-radius:4px;padding:2px 6px;display:flex;flex-direction:column;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .pay span:last-child{font-variant-numeric:tabular-nums;opacity:.85}
.cal .pay.big{background:var(--fixed);color:#fff}
.cal .pay.miss{background:#fdecea;color:#b3261e}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;margin-bottom:8px;font-size:13px}
.note.up{background:#fff3e0}
.note.miss{background:#fdecea}
.note b{font-weight:500}
.note .sub{color:var(--muted);font-size:12px}
svg text{fill:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="app">
  <div class="side"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
  <div class="main">
    <div class="top"><b>Forbrug</b></div>
    <div class="page" id="page"></div>
  </div>
</div>
<script>
const V = new URLSearchParams(location.search).get('v') || 'a';
const kr = v => Math.round(v).toLocaleString('da-DK') + ' kr.';
const pct = (v, t) => Math.round(100 * v / t) + ' %';
const months = ['jan', 'feb', 'mar', 'apr', 'maj', 'jun', 'jul', 'aug', 'sep', 'okt'];
const per = {'Månedlig': 1, 'Kvartalsvis': 3, 'Halvårlig': 6, 'Årlig': 12};
// [name, main group › category, repeat, amount, next date, status, status text]
const subs = [
  ['Husleje', 'Bolig › Husleje', 'Månedlig', 9800, '1. nov', 'ok', 'Betalt 1. nov'],
  ['Institution', 'Børn › Institution', 'Månedlig', 3150, '1. nov', 'ok', 'Betalt 1. nov'],
  ['Internet', 'Bolig › Internet', 'Månedlig', 299, '3. nov', 'due', 'Forventes 3. nov'],
  ['Mobil', 'Abonnementer › Mobil', 'Månedlig', 238, '5. nov', 'due', 'Forventes 5. nov'],
  ['Fitness', 'Fritid › Sport', 'Månedlig', 349, '7. nov', 'due', 'Forventes 7. nov'],
  ['Streaming A', 'Abonnementer › Streaming', 'Månedlig', 169, '12. nov', 'up', '149 → 169 kr. siden sep'],
  ['Musik', 'Abonnementer › Streaming', 'Månedlig', 179, '14. nov', 'due', 'Forventes 14. nov'],
  ['Streaming B', 'Abonnementer › Streaming', 'Månedlig', 99, '18. nov', 'due', 'Forventes 18. nov'],
  ['Avis', 'Abonnementer › Aviser', 'Månedlig', 229, '20. nov', 'due', 'Forventes 20. nov'],
  ['El', 'Bolig › El', 'Kvartalsvis', 2400, '15. okt', 'miss', 'Ikke set · ventet 15. okt'],
  ['Fagforening', 'Forsikring og fagforening › Fagforening', 'Kvartalsvis', 1410, '1. jan', 'ok', 'Betalt 1. okt'],
  ['Bilforsikring', 'Bil › Forsikring', 'Halvårlig', 4200, '1. jan', 'ok', 'Betalt 1. jul'],
  ['Vægtafgift', 'Bil › Afgifter', 'Halvårlig', 1180, '10. jan', 'ok', 'Betalt 10. jul'],
  ['Indboforsikring', 'Forsikring og fagforening › Forsikring', 'Årlig', 2950, '1. mar', 'ok', 'Betalt 1. mar'],
];
const monthly = s => s[3] / per[s[2]];
const fixedMonth = subs.reduce((a, s) => a + monthly(s), 0);
function noise(i, s){ const x = Math.sin(i*12.9898 + s*78.233)*43758.5453; return x - Math.floor(x); }
// Fixed per month: the monthly ones every month, the rest in the months they fall.
const fixedSeries = months.map((m, i) => 9800+3150+299+238+349+179+99+229+(i >= 8 ? 169 : 149) + (i % 3 === 0 ? 2400 + 1410 : 0) + (i === 0 || i === 6 ? 4200 + 1180 : 0) + (i === 2 ? 2950 : 0));
const varSeries = months.map((m, i) => 24500 + 9000*noise(i, 3) + (i === 5 || i === 6 ? 11000 : 0));
const fixedTotal = fixedSeries.reduce((a, b) => a + b, 0), varTotal = varSeries.reduce((a, b) => a + b, 0), total = fixedTotal + varTotal;
function axis(v){ return v >= 2000 ? Math.round(v/1000) + 'k' : String(Math.round(v)); }

function header(title, extra){
  return `<div class="card"><div class="bar-row">
    <div style="display:flex;gap:16px;align-items:center"><div class="crumbs">${title}</div>${extra || ''}</div>
    <div class="filters"><div class="sel"><small>Periode</small><span>I år · 1. jan – 31. okt 2026</span></div><div class="sel"><small>Gruppér pr.</small><span>Måned</span></div><div class="sel"><small>Konti</small><span>Alle konti (2)</span></div></div>
  </div></div>`;
}
// Bars, stacked when given several series; the last series gets the rounded top.
function bars(stack, W, H, avg){
  const n = months.length, pad = 36, step = (W - pad) / n, bw = Math.min(40, step - 14);
  const tot = months.map((m, i) => stack.reduce((a, s) => a + s[0][i], 0)), max = Math.max(...tot) * 1.1;
  let g = '';
  for (let t = 0; t <= 4; t++){ const y = 10 + (H-40)*(1 - t/4); g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#ececec"/><text x="0" y="${y+4}">${axis(max*t/4)}</text>`; }
  months.forEach((m, i) => { let y = 10 + (H-40); const x = pad + i*step + (step - bw)/2;
    stack.forEach((s, k) => { const h = (H-40) * s[0][i] / max; y -= h; const last = k === stack.length - 1;
      g += `<rect x="${x}" y="${y + (last ? 0 : 1)}" width="${bw}" height="${Math.max(0, h - (last ? 0 : 1))}" ${last ? 'rx="4"' : ''} fill="${s[1]}"/>`; });
    g += `<text x="${x + bw/2}" y="${H-12}" text-anchor="middle">${m}</text>`; });
  if (avg) { const y = 10 + (H-40) * (1 - avg/max); g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#6b6b6b" stroke-dasharray="4 4"/><text x="${pad + 4}" y="${y-5}">gennemsnit ${kr(avg)}</text>`; }
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function spark(vals, W, H, hi){
  const max = Math.max(...vals) * 1.05, bw = W / vals.length - 3;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${vals.map((v, i) => `<rect x="${i*(bw+3)}" y="${H - H*v/max}" width="${bw}" height="${H*v/max}" rx="2" fill="${hi && hi(i) ? '#f29d38' : '#9fd8f7'}"/>`).join('')}</svg>`;
}
const status = s => `<span class="st ${s[5]}">${s[6]}</span>`;

let html = '';
if (V === 'a') {
  // A: today's overview, plus a key number for the subscriptions and a card that lists them.
  html += header('Alt forbrug');
  html += `<div class="kpis four">
    <div class="card kpi"><div class="label">Forbrug i perioden</div><div class="v">${kr(total)}</div><div class="s">1. jan – 31. okt 2026</div></div>
    <div class="card kpi"><div class="label">Gennemsnit pr. måned</div><div class="v">${kr(total/10)}</div><div class="s">10 måneder</div></div>
    <div class="card kpi"><div class="label">Oktober mod september</div><div class="v">-4 %</div><div class="s">▼ 1.788 kr.</div></div>
    <div class="card kpi new"><div class="label">Abonnementer pr. måned</div><div class="v">${kr(fixedMonth)}</div><div class="s">${subs.length} abonnementer · ${kr(fixedMonth*12)} om året</div></div>
  </div>`;
  const sorted = subs.slice().sort((p, q) => ({miss: 0, up: 1, due: 2, ok: 3})[p[5]] - ({miss: 0, up: 1, due: 2, ok: 3})[q[5]]);
  const rows = sorted.map(s => `<tr><td>${s[0]}<span class="sub">${s[1]}</span></td><td>${s[2]}</td><td class="r">${kr(s[3])}</td><td class="r">${kr(monthly(s))}</td><td>${s[4]}</td><td>${status(s)}</td></tr>`).join('');
  html += `<div class="card"><h2>Abonnementer<small>fra Firefly III · klik på et abonnement for dets posteringer</small></h2>
    <table><tr><th>Abonnement</th><th>Gentages</th><th class="r">Beløb</th><th class="r">Pr. måned</th><th>Næste</th><th>Status</th></tr>${rows}
    <tr><td style="font-weight:500">I alt</td><td></td><td></td><td class="r" style="font-weight:500">${kr(fixedMonth)}</td><td></td><td></td></tr></table>
    <div class="foot">Det ene, der mangler, og det ene, der er steget, står øverst. Under listen står cirklen og søjlerne som i dag.</div></div>`;
} else if (V === 'b') {
  // B: every amount split in fixed (paid through a subscription) and variable (the rest).
  html += header('Alt forbrug', `<div class="seg"><span class="on">Alt</span><span>Faste</span><span>Variable</span></div>`);
  html += `<div class="kpis">
    <div class="card kpi"><div class="label">Forbrug i perioden</div><div class="v">${kr(total)}</div><div class="s">1. jan – 31. okt 2026</div></div>
    <div class="card kpi"><div class="label"><span class="dot" style="background:var(--fixed)"></span>Faste udgifter</div><div class="v">${kr(fixedTotal)}</div><div class="s">${pct(fixedTotal, total)} af forbruget · ${kr(fixedTotal/10)} pr. måned</div></div>
    <div class="card kpi"><div class="label"><span class="dot" style="background:var(--var)"></span>Variabelt forbrug</div><div class="v">${kr(varTotal)}</div><div class="s">${pct(varTotal, total)} af forbruget · ${kr(varTotal/10)} pr. måned</div></div>
  </div>`;
  const groups = [['Bolig', 132000, 119800], ['Mad', 95800, 0], ['Fritid', 65600, 3490], ['Bil', 74500, 10760], ['Børn', 42500, 31500], ['Forsikring og fagforening', 13200, 8590], ['Abonnementer', 9700, 9500], ['Sommerhus', 23100, 0], ['Personligt', 19400, 0], ['Andet', 6200, 0]].sort((p, q) => q[1] - p[1]);
  const gmax = groups[0][1];
  const rows = groups.map(g => `<div class="hb"><span>${g[0]}</span><span class="track" style="width:${Math.round(100*g[1]/gmax)}%"><span style="width:${100*g[2]/g[1]}%;background:var(--fixed)"></span><span style="flex:1;background:var(--var)"></span></span><span class="amt">${kr(g[1])}<small>fast ${kr(g[2])} · ${pct(g[2], g[1])}</small></span></div>`).join('');
  html += `<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
    <div class="card"><h2>Hovedgrupper<span class="legend"><span><span class="dot" style="background:var(--fixed)"></span>Fast</span><span><span class="dot" style="background:var(--var)"></span>Variabelt</span></span></h2>${rows}
      <div class="foot">Klik på en hovedgruppe for dens kategorier; den mørke del viser dens abonnementer.</div></div>
    <div class="card"><h2>Pr. måned<span class="legend"><span><span class="dot" style="background:var(--fixed)"></span>Fast</span><span><span class="dot" style="background:var(--var)"></span>Variabelt</span></span></h2>${bars([[fixedSeries, '#0277bd'], [varSeries, '#9fd8f7']], 640, 420, total/10)}
      <div class="foot">De faste udgifter ligger nederst, så det variable forbrug kan ses for sig. Toppe i jan og jul er halvårlige betalinger.</div></div>
  </div>`;
} else {
  // C: subscriptions as their own screen beside Forbrug: the coming month as a calendar, and what changed.
  html += header('Abonnementer', `<div class="seg"><span>Forbrug</span><span class="on">Abonnementer</span></div>`);
  const next30 = [9800, 3150, 299, 238, 349, 169, 179, 99, 229, 4200].reduce((a, b) => a + b, 0);
  html += `<div class="kpis">
    <div class="card kpi"><div class="label">Faste udgifter pr. måned</div><div class="v">${kr(fixedMonth)}</div><div class="s">${subs.length} abonnementer · ${kr(fixedMonth*12)} om året</div></div>
    <div class="card kpi"><div class="label">De næste 30 dage</div><div class="v">${kr(next30)}</div><div class="s">10 betalinger · 1. nov – 1. dec</div></div>
    <div class="card kpi"><div class="label">Skal ses på</div><div class="v">2</div><div class="s"><span class="st up">1 steget</span> <span class="st miss">1 ikke set</span></div></div>
  </div>`;
  // November 2026 starts on a Sunday.
  const pays = {1: [['Husleje', 9800, 'big'], ['Institution', 3150, 'big']], 3: [['Internet', 299]], 5: [['Mobil', 238]], 7: [['Fitness', 349]], 12: [['Streaming A', 169]], 14: [['Musik', 179]], 18: [['Streaming B', 99]], 20: [['Avis', 229]]};
  let cal = ['man', 'tir', 'ons', 'tor', 'fre', 'lør', 'søn'].map(d => `<div class="h">${d}</div>`).join('');
  for (let i = 26; i <= 31; i++) cal += `<div class="d out"><span class="n">${i}</span></div>`;
  for (let d = 1; d <= 30; d++) cal += `<div class="d ${d === 1 ? 'today' : ''}"><span class="n">${d}</span>${(pays[d] || []).map(p => `<span class="pay ${p[2] || ''}"><span>${p[0]}</span><span>${Math.round(p[1]).toLocaleString('da-DK')}</span></span>`).join('')}</div>`;
  for (let i = 1; i <= 6; i++) cal += `<div class="d out"><span class="n">${i}</span>${i === 1 ? '<span class="pay" style="opacity:.6"><span>Bilforsikring</span><span>4.200</span></span>' : ''}</div>`;
  const sA = months.map((m, i) => i >= 8 ? 169 : 149);
  const list = subs.map(s => `<tr><td>${s[0]}<span class="sub">${s[2]} · ${s[1].split(' › ')[0]}</span></td><td class="r">${kr(monthly(s))}</td><td>${status(s)}</td></tr>`).join('');
  html += `<div style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:14px">
    <div class="card"><h2>November 2026<small>‹ okt · dec ›</small></h2><div class="cal">${cal}</div>
      <div class="foot">Datoerne er Firefly III's næste forventede betaling. Klik på en betaling for abonnementets posteringer.</div></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card"><h2>Skal ses på</h2>
        <div class="note up"><div style="flex:1"><b>Streaming A er steget</b><div class="sub">149 → 169 kr. pr. måned siden september (+13 %), 240 kr. mere om året</div></div>${spark(sA, 120, 32, i => i >= 8)}</div>
        <div class="note miss"><div style="flex:1"><b>El er ikke set</b><div class="sub">Ventet omkring 15. oktober, 1.800 – 3.000 kr.; ingen postering er koblet til abonnementet</div></div></div></div>
      <div class="card"><h2>Alle abonnementer<small>pr. måned</small></h2><table>${list}</table></div>
    </div>
  </div>`;
}
document.getElementById('page').innerHTML = html;
</script>
</body>
</html>
