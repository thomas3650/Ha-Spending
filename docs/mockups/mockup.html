<!doctype html>
<!-- Mockup of the spending overview, the add-on's page in Home Assistant's side menu.
     Made-up numbers and names only. Open with ?s=1 to ?s=10:
     1-3 the three levels for Mad, 4-7 other ways to show categories and
     postings, 8-10 circles. The PNGs beside it are screenshots. -->
<html lang="da">
<head>
<meta charset="utf-8">
<title>Forbrug – mockup</title>
<style>
:root{--bg:#111111;--side:#1c1c1c;--card:#1c1c1c;--line:#2f2f2f;--text:#e1e1e1;--muted:#9b9b9b;--accent:#03a9f4;--bar:#03a9f4;--bar2:#ff9800;--chip:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:14px}
.app{display:flex;min-height:100vh}
.side{width:56px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:18px}
.side i{display:block;width:22px;height:22px;border-radius:5px;background:#3a3a3a}
.side i.on{background:var(--accent)}
.main{flex:1;min-width:0}
.top{height:56px;display:flex;align-items:center;gap:28px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--side)}
.top b{font-size:20px;font-weight:400}
.tabs{display:flex;gap:22px;height:100%}
.tabs span{display:flex;align-items:center;color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.04em;border-bottom:2px solid transparent}
.tabs span.on{color:var(--accent);border-bottom-color:var(--accent)}
.page{padding:16px 20px;display:flex;flex-direction:column;gap:14px;max-width:1360px}
.card{background:var(--card);border-radius:12px;border:1px solid var(--line);padding:16px}
.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.group{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:16px;background:var(--chip);color:var(--text);font-size:13px;border:1px solid var(--line)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#000;font-weight:600}
.label{color:var(--muted);font-size:12px;margin-right:4px}
.crumbs{font-size:16px;display:flex;gap:8px;align-items:center}
.crumbs a{color:var(--accent);text-decoration:none}
.crumbs .sep{color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px}
h2{margin:0 0 12px;font-size:16px;font-weight:500;display:flex;justify-content:space-between}
h2 small{color:var(--muted);font-weight:400;font-size:13px}
.row{display:grid;grid-template-columns:22px 1fr auto 18px;gap:10px;align-items:center;padding:9px 6px;border-radius:8px}
.row:hover,.row.hl{background:#262626}
.row .dot{width:12px;height:12px;border-radius:3px}
.row .name{display:flex;flex-direction:column;gap:6px}
.row .track{height:6px;background:#2b2b2b;border-radius:3px}
.row .fill{height:6px;border-radius:3px}
.row .amt{font-variant-numeric:tabular-nums;text-align:right}
.row .amt small{display:block;color:var(--muted);font-size:11px}
.row .chev{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--muted);font-weight:500;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #242424;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.kpi .v{font-size:24px;margin-top:4px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.up{color:#ef5350}.down{color:#66bb6a}
svg text{fill:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="app">
  <div class="side"><i></i><i></i><i class="on"></i><i></i><i></i><i></i></div>
  <div class="main">
    <div class="top"><b>Økonomi</b><div class="tabs"><span class="on">Forbrug</span><span>Konti</span></div></div>
    <div class="page" id="page"></div>
  </div>
</div>
<script>
const S = new URLSearchParams(location.search).get('s') || '1';
const kr = v => Math.round(v).toLocaleString('da-DK') + ' kr.';
const colors = ['#03a9f4','#ff9800','#8bc34a','#e91e63','#9c27b0','#00bcd4','#ffc107','#795548','#607d8b','#cddc39','#3f51b5','#9e9e9e'];
// Made-up monthly averages, kr.
const groups = [
  ['Mad', 9800, [['Dagligvarer',7000],['Café, restaurant og take away',2300],['Kaffe',350],['Aftensmad fra arbejdet',150]]],
  ['Bolig', 11500, []], ['Bil', 7400, []], ['Fritid', 5600, []], ['Børn', 4300, []],
  ['Sommerhus', 2400, []], ['Personligt', 1900, []], ['Abonnementer', 1000, []],
  ['Forsikring og fagforening', 1400, []], ['Transport', 500, []], ['Andet', 600, []]];
const months = ['jan','feb','mar','apr','maj','jun','jul','aug','sep','okt'];
function noise(i, s){ const x = Math.sin(i*12.9898 + s*78.233)*43758.5453; return x - Math.floor(x); }
function axis(v){ return v >= 2000 ? Math.round(v/1000) + 'k' : String(Math.round(v)); }
function bars(values, labels, title, note, color){
  const W = 760, H = 250, pad = 34, n = values.length, gap = n > 20 ? 2 : 6;
  const max = Math.max(...values) * 1.1, bw = (W - pad - 8 - gap*(n-1)) / n;
  let g = '';
  for (let t = 0; t <= 4; t++){ const y = 10 + (H-40) * (1 - t/4); g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#2a2a2a"/><text x="0" y="${y+4}">${axis(max*t/4)}</text>`; }
  values.forEach((v, i) => { const h = (H-40) * v / max, x = pad + 4 + i*(bw+gap), y = 10 + (H-40) - h;
    g += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="3" fill="${color}"/>`;
    if (labels[i]) g += `<text x="${x + bw/2}" y="${H-12}" text-anchor="middle">${labels[i]}</text>`; });
  return `<div class="card"><h2>${title}<small>${note}</small></h2><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
}
function stacked(series, cats, labels, title, note){
  const W = 760, H = 270, pad = 34, n = labels.length, gap = 10;
  const totals = labels.map((_, i) => series.reduce((s, x) => s + x[i], 0));
  const max = Math.max(...totals) * 1.1, bw = (W - pad - 8 - gap*(n-1)) / n;
  let g = '';
  for (let t = 0; t <= 4; t++){ const y = 10 + (H-60) * (1 - t/4); g += `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#2a2a2a"/><text x="0" y="${y+4}">${axis(max*t/4)}</text>`; }
  labels.forEach((l, i) => { let y = 10 + (H-60); const x = pad + 4 + i*(bw+gap);
    series.forEach((s, k) => { const h = (H-60) * s[i] / max; y -= h; if (h > 0.5) g += `<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${cats[k][2]}"/>`; });
    g += `<text x="${x + bw/2}" y="${H-32}" text-anchor="middle">${l}</text>`; });
  let lx = pad; cats.forEach(c => { g += `<rect x="${lx}" y="${H-16}" width="10" height="10" rx="2" fill="${c[2]}"/><text x="${lx+14}" y="${H-7}">${c[0]}</text>`; lx += 24 + c[0].length * 6; });
  return `<div class="card"><h2>${title}<small>${note}</small></h2><svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg></div>`;
}
function header(crumbs, grain, period){
  period = period || 'I år';
  const c = crumbs.map((x, i) => i < crumbs.length-1 ? `<a href="#">${x}</a><span class="sep">›</span>` : `<b>${x}</b>`).join('');
  const g = ['Måned','Uge','Dag'].map(x => `<span class="chip ${x===grain?'on':''}">${x}</span>`).join('');
  return `<div class="card"><div class="bar-row">
    <div class="crumbs">${c}</div>
    <div class="group"><span class="label">Periode</span>${['Denne måned','Sidste måned','I år'].map(x => `<span class="chip ${x===period?'on':''}">${x}</span>`).join('')}<span class="chip">${period==='Denne måned'?'1. – 31. okt 2026':'1. jan – 30. okt 2026'}</span></div>
    <div class="group"><span class="label">Gruppér pr.</span>${g}</div>
    <div class="group"><span class="label">Konti</span><span class="chip">Alle konti (2) ▾</span></div>
  </div></div>`;
}
function list(title, items, total, foot){
  const max = Math.max(...items.map(x => x[1]));
  const rows = items.map((x, i) => `<div class="row ${x[3]?'hl':''}"><span class="dot" style="background:${x[2]||colors[i%colors.length]}"></span>
    <span class="name">${x[0]}<span class="track"><span class="fill" style="display:block;width:${Math.round(100*x[1]/max)}%;background:${x[2]||colors[i%colors.length]}"></span></span></span>
    <span class="amt">${kr(x[1])}<small>${Math.round(100*x[1]/total)} %</small></span><span class="chev">›</span></div>`).join('');
  return `<div class="card"><h2>${title}<small>${kr(total)}</small></h2>${rows}<div class="foot">${foot}</div></div>`;
}
// The circles use their own palette, checked for colour blindness on the
// dark card; "Øvrige" is grey. At most six pieces, the rest go in "Øvrige".
const ring = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#8a8a8a'];
function top5(items){
  const s = [...items].sort((a, b) => b[1] - a[1]), rest = s.slice(5).reduce((a, x) => a + x[1], 0);
  return s.slice(0, 5).concat(rest ? [['Øvrige', rest]] : []).map((x, i) => [x[0], x[1], ring[i], x[3]]);
}
function arc(cx, cy, r0, r1, a0, a1){
  const p = (r, a) => `${(cx + r*Math.cos(a)).toFixed(1)} ${(cy + r*Math.sin(a)).toFixed(1)}`, l = a1 - a0 > Math.PI ? 1 : 0;
  return `M${p(r1,a0)}A${r1} ${r1} 0 ${l} 1 ${p(r1,a1)}L${p(r0,a1)}A${r0} ${r0} 0 ${l} 0 ${p(r0,a0)}Z`;
}
// One ring, or two when a piece has children: [name, value, colour, children].
function donut(items, centre, tip){
  const W = 760, H = 430, cx = 380, cy = 215, total = items.reduce((s, x) => s + x[1], 0);
  const two = items.some(x => x[3] && x[3].length), r0 = two ? 70 : 105, r1 = two ? 125 : 165, r2 = 172;
  let g = '', a = -Math.PI/2;
  const labels = [], tint = (hex, k) => '#' + [1, 3, 5].map(i => Math.round(parseInt(hex.substr(i, 2), 16) + (255 - parseInt(hex.substr(i, 2), 16)) * 0.22*k).toString(16).padStart(2, '0')).join('');
  items.forEach(x => {
    const a1 = a + 2*Math.PI * x[1]/total, m = (a + a1)/2, pc = Math.round(100*x[1]/total);
    g += `<path d="${arc(cx, cy, r0, r1, a, a1)}" fill="${x[2]}" stroke="#1c1c1c" stroke-width="2"/>`;
    if (two) {
      let b = a;
      (x[3] || [[x[0], x[1]]]).forEach((c, k) => { const b1 = b + 2*Math.PI * c[1]/total;
        g += `<path d="${arc(cx, cy, r1 + 4, r2, b, b1)}" fill="${tint(x[2], k)}" stroke="#1c1c1c" stroke-width="2"/>`; b = b1; });
      if (pc >= 6) g += `<text x="${cx + 97*Math.cos(m)}" y="${cy + 97*Math.sin(m) + 4}" text-anchor="middle" style="fill:#fff;font-size:12px">${pc} %</text>`;
    }
    const lr = (two ? r2 : r1) + 14;
    labels.push({x, pc, m, right: Math.cos(m) >= 0, y: cy + lr*Math.sin(m), r: lr});
    a = a1;
  });
  // Spread the labels on each side so small pieces do not overlap.
  [true, false].forEach(side => {
    const l = labels.filter(o => o.right === side).sort((p, q) => p.y - q.y);
    for (let i = 1; i < l.length; i++) l[i].y = Math.max(l[i].y, l[i-1].y + 34);
    for (let i = l.length - 2; i >= 0; i--) if (l[i].y > l[i+1].y - 34) l[i].y = l[i+1].y - 34;
    l.forEach(o => { const px = cx + o.r*Math.cos(o.m), py = cy + o.r*Math.sin(o.m), ex = cx + (side ? 1 : -1) * (o.r + 40);
      g += `<polyline points="${cx + (o.r-10)*Math.cos(o.m)},${cy + (o.r-10)*Math.sin(o.m)} ${px},${py} ${ex},${o.y}" fill="none" stroke="#555"/>`;
      g += `<text x="${ex + (side ? 5 : -5)}" y="${o.y - 2}" text-anchor="${side ? 'start' : 'end'}" style="fill:var(--text);font-size:13px">${o.x[0]}</text>`;
      g += `<text x="${ex + (side ? 5 : -5)}" y="${o.y + 13}" text-anchor="${side ? 'start' : 'end'}">${kr(o.x[1])} · ${o.pc} %</text>`; });
  });
  g += `<text x="${cx}" y="${cy - 6}" text-anchor="middle" style="fill:var(--muted);font-size:13px">${centre}</text><text x="${cx}" y="${cy + 18}" text-anchor="middle" style="fill:var(--text);font-size:20px">${kr(total)}</text>`;
  if (tip) g += `<g transform="translate(${tip[0]},${tip[1]})"><rect width="190" height="54" rx="8" fill="#2a2a2a" stroke="#444"/><text x="12" y="21" style="fill:var(--text);font-size:13px">${tip[2]}</text><text x="12" y="41">${tip[3]}</text></g>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function kpis(a){ return `<div class="kpis">${a.map(k => `<div class="card kpi"><div class="label">${k[0]}</div><div class="v">${k[1]}</div><div class="s">${k[2]}</div></div>`).join('')}</div>`; }
let html = '';
if (S === '1') {
  const items = groups.map(g => [g[0], g[1]*10]).sort((a,b) => b[1]-a[1]);
  const total = items.reduce((s,x) => s + x[1], 0);
  const vals = months.map((m,i) => total/10 * (0.8 + 0.4*noise(i,1)));
  html = header(['Alt forbrug'], 'Måned') + kpis([['Forbrug i perioden', kr(total), '1. jan – 30. okt 2026'],['Gennemsnit pr. måned', kr(total/10), '10 måneder'],['Oktober mod september', '+6 %', '<span class="up">▲ 3.140 kr.</span>']]) +
    `<div class="grid">${list('Hovedgrupper', items, total, 'Klik på en hovedgruppe for at se dens kategorier. "Uden hovedgruppe" vises her, hvis en kategori mangler en plads i reglerne.')}${bars(vals, months, 'Alt forbrug pr. måned', 'Klik på en søjle for kun den måned', '#03a9f4')}</div>`;
} else if (S === '2') {
  const mad = groups[0];
  const items = mad[2].map((c,i) => [c[0], c[1]*10, colors[i], i===0]);
  const total = items.reduce((s,x) => s + x[1], 0);
  const weeks = Array.from({length: 43}, (_, i) => mad[1]/4.3 * (0.55 + 0.9*noise(i,2)));
  const wl = weeks.map((_, i) => i % 4 === 0 ? 'u' + (i+1) : '');
  html = header(['Alt forbrug', 'Mad'], 'Uge') + kpis([['Mad i perioden', kr(total), '1. jan – 30. okt 2026'],['Gennemsnit pr. uge', kr(total/43), '43 uger'],['Største uge', 'uge 29', 'sommerferien']]) +
    `<div class="grid">${list('Mad: kategorier', items, total, 'Kategorierne og hovedgrupperne læses fra Firefly: en ny kategori dukker op af sig selv.')}${bars(weeks, wl, 'Mad pr. uge', 'Gruppér pr. uge', '#ff9800')}</div>`;
} else if (S === '3') {
  const shops = [['03.10','Supermarked C','Konto 2',-350],['04.10','Bageri','Konto 2',-95],['06.10','Supermarked A','Konto 1',-312],['09.10','Bageri','Konto 2',-64],['11.10','Købmand','Konto 2',-35],['14.10','Supermarked C','Konto 2',-820],['18.10','Supermarked C','Konto 2',-540],['21.10','Slagter','Konto 2',-185],['24.10','Delikatesse','Konto 2',-130],['27.10','Supermarked A','Konto 2',-276],['29.10','Supermarked B','Konto 2',-198]];
  const days = Array.from({length: 30}, (_, i) => { const t = shops.filter(s => +s[0].slice(0,2) === i+1).reduce((a,s) => a - s[3], 0); return t; });
  const dl = days.map((_, i) => i % 5 === 0 ? (i+1) + '/10' : '');
  const total = shops.reduce((a,s) => a - s[3], 0);
  const rows = shops.map(s => `<tr><td>${s[0]}.2026</td><td>${s[1]}</td><td>${s[2]}</td><td class="r">${s[3].toLocaleString('da-DK',{minimumFractionDigits:2})}</td></tr>`).join('');
  html = header(['Alt forbrug', 'Mad', 'Dagligvarer'], 'Dag', 'Denne måned') +
    `<div class="grid"><div class="card"><h2>Dagligvarer: posteringer<small>${kr(total)} · oktober</small></h2>
      <table><thead><tr><th>Dato</th><th>Tekst</th><th>Konto</th><th class="r">Beløb</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot">Klik på en postering for at åbne den i Firefly. Teksten er bankens.</div></div>
    ${bars(days, dl, 'Dagligvarer pr. dag', 'Periode: oktober', '#8bc34a')}</div>`;
} else if (S === '4') {
  // Bil: categories, stacked bars per month.
  const cats = [['Billån og afgift', 5500, '#03a9f4'], ['Opladning ude', 700, '#ff9800'], ['Bro, færge og vej', 450, '#8bc34a'], ['Opladning hjemme', 300, '#e91e63'], ['Bilservice', 350, '#9c27b0'], ['Parkering', 100, '#00bcd4']];
  const series = cats.map((c, k) => months.map((m, i) => c[1] * (k === 0 ? 1 : (k === 4 ? (i === 6 ? 7 : i === 8 ? 10 : 0) : 0.3 + 1.4 * noise(i, k + 5)))));
  const items = cats.map((c, k) => [c[0], series[k].reduce((a, b) => a + b, 0), c[2], k === 3]);
  const total = items.reduce((s, x) => s + x[1], 0);
  html = header(['Alt forbrug', 'Bil'], 'Måned') + kpis([['Bil i perioden', kr(total), '1. jan – 30. okt 2026'], ['Gennemsnit pr. måned', kr(total / 10), '10 måneder'], ['Opladning hjemme mod ude', '1 : ' + (items.find(x => x[0]==='Opladning ude')[1] / items.find(x => x[0]==='Opladning hjemme')[1]).toLocaleString('da-DK', {maximumFractionDigits: 1}), 'ude koster mest']]) +
    `<div class="grid">${list('Bil: kategorier', items.sort((a, b) => b[1] - a[1]), total, 'Hver kategori har sin farve, også i søjlerne til højre.')}${stacked(series, cats, months, 'Bil pr. måned, delt på kategorier', 'Hold musen over et felt for beløbet')}</div>`;
} else if (S === '5') {
  // Bil › Opladning hjemme: postings, by month.
  const posts = [];
  months.forEach((m, i) => { const n = 2 + Math.floor(3 * noise(i, 9)); for (let j = 0; j < n; j++) posts.push([String(3 + j * 9).padStart(2, '0') + '.' + String(i + 1).padStart(2, '0'), j % 3 === 2 ? 'Ladeoperatør B' : 'Ladeoperatør A', 'Konto 2', -(25 + Math.round(70 * noise(i * 7 + j, 11)) + 0.4)]); });
  const per = months.map((m, i) => posts.filter(p => +p[0].slice(3, 5) === i + 1).reduce((a, p) => a - p[3], 0));
  const total = posts.reduce((a, p) => a - p[3], 0);
  const shown = posts.slice(-12).reverse();
  const rows = shown.map(p => `<tr><td>${p[0]}.2026</td><td>${p[1]}</td><td>${p[2]}</td><td class="r">${p[3].toLocaleString('da-DK', { minimumFractionDigits: 2 })}</td></tr>`).join('');
  html = header(['Alt forbrug', 'Bil', 'Opladning hjemme'], 'Måned') + kpis([['Opladning hjemme', kr(total), posts.length + ' opladninger'], ['Pr. opladning', kr(total / posts.length), 'i gennemsnit'], ['Pr. måned', kr(total / 10), '10 måneder']]) +
    `<div class="grid"><div class="card"><h2>Opladning hjemme: posteringer<small>${posts.length} i alt · viser de nyeste 12</small></h2>
      <div class="group" style="margin-bottom:10px"><span class="chip on">Nyeste først</span><span class="chip">Største først</span><span class="chip">Søg i teksten …</span></div>
      <table><thead><tr><th>Dato</th><th>Tekst</th><th>Konto</th><th class="r">Beløb</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot">Vis alle ${posts.length} ›</div></div>
    ${bars(per, months, 'Opladning hjemme pr. måned', 'Klik på en søjle for kun den måneds posteringer', '#e91e63')}</div>`;
} else if (S === '6') {
  // Sommerhus: categories and the selected category's postings on one page.
  const cats = [['Sommerhus: byggemarked og vedligeholdelse', 14200, '#03a9f4', true], ['Sommerhus: møbler og have', 2600, '#ff9800'], ['Sommerhus: overførsel', 10000, '#8bc34a']];
  const total = cats.reduce((s, x) => s + x[1], 0);
  const posts = [['26.07', 'Byggemarked', -1840], ['24.07', 'Byggemarked', -615], ['22.07', 'Farvehandel', -186], ['18.07', 'Byggemarked', -2410], ['03.06', 'Byggemarked', -980], ['29.05', 'Isenkræmmer', -320], ['27.05', 'Byggemarked', -3120], ['14.04', 'Byggemarked', -845], ['21.03', 'Byggemarked', -1290]];
  const rows = posts.map(p => `<tr><td>${p[0]}.2026</td><td>${p[1]}</td><td class="r">${p[2].toLocaleString('da-DK', { minimumFractionDigits: 2 })}</td></tr>`).join('');
  const vals = months.map((m, i) => [0, 0, 1290, 845, 3440, 980, 5051, 0, 0, 0][i] + (i === 5 ? 10000 : 0) + [0, 0, 0, 0, 0, 800, 1800, 0, 0, 0][i]);
  html = header(['Alt forbrug', 'Sommerhus'], 'Måned') +
    `<div class="grid"><div style="display:flex;flex-direction:column;gap:14px">${list('Sommerhus: kategorier', cats, total, 'Den valgte kategori har en lys baggrund; dens posteringer står nedenunder.')}
      <div class="card"><h2>Sommerhus: byggemarked og vedligeholdelse<small>${posts.length} posteringer</small></h2>
      <table><thead><tr><th>Dato</th><th>Tekst</th><th class="r">Beløb</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    ${bars(vals, months, 'Sommerhus pr. måned', 'Sommeren skiller sig ud', '#00bcd4')}</div>`;
} else if (S === '7') {
  // Fritid › Sport og fritid: postings grouped by receiver, with subtotals.
  const groupsR = [['Klatreklub', [['02.10', -545], ['01.09', -545], ['01.08', -545], ['01.07', -545]], true], ['Klatrehal', [['18.10', -120], ['04.10', -120], ['20.09', -120], ['06.09', -95], ['23.08', -120]]], ['Svømmehal', [['05.10', -110], ['05.10', -42], ['17.03', -110]]], ['Cykelhandler', [['12.06', -1450], ['30.04', -380]]], ['Sportsbutik', [['28.02', -899]]]];
  groupsR.sort((a, b) => a[1].reduce((s, p) => s + p[1], 0) - b[1].reduce((s, p) => s + p[1], 0));
  const total = groupsR.reduce((s, g) => s - g[1].reduce((a, p) => a + p[1], 0), 0);
  let rows = '';
  groupsR.forEach(g => { const sub = -g[1].reduce((a, p) => a + p[1], 0);
    rows += `<tr style="background:#242424"><td>${g[2] ? '▾' : '▸'} <b>${g[0]}</b></td><td>${g[1].length} posteringer</td><td class="r"><b>${(-sub).toLocaleString('da-DK', { minimumFractionDigits: 2 })}</b></td></tr>`;
    if (g[2]) g[1].forEach(p => { rows += `<tr><td style="padding-left:28px">${p[0]}.2026</td><td>${g[0]}</td><td class="r">${p[1].toLocaleString('da-DK', { minimumFractionDigits: 2 })}</td></tr>`; }); });
  const items = groupsR.map((g, i) => [g[0], -g[1].reduce((a, p) => a + p[1], 0), colors[i], !!g[2]]);
  html = header(['Alt forbrug', 'Fritid', 'Sport og fritid'], 'Måned') +
    `<div class="grid"><div class="card"><h2>Sport og fritid: posteringer pr. modtager<small>${kr(total)}</small></h2>
      <div class="group" style="margin-bottom:10px"><span class="chip">Liste</span><span class="chip on">Pr. modtager</span></div>
      <table><thead><tr><th>Modtager / dato</th><th></th><th class="r">Beløb</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot">Modtageren læses af bankens tekst; en modtager klappes ud med et klik.</div></div>
    ${list('Sport og fritid: modtagere', items, total, 'Hvem pengene går til i kategorien.')}</div>`;
} else if (S === '8') {
  // Alt forbrug as a circle: five main groups and "Øvrige".
  const items = top5(groups.map(g => [g[0], g[1]*10]));
  const total = items.reduce((s, x) => s + x[1], 0);
  const rest = groups.map(g => [g[0], g[1]*10]).sort((a, b) => b[1] - a[1]).slice(5);
  html = header(['Alt forbrug'], 'Måned') +
    `<div class="grid">${list('Hovedgrupper', items, total, 'Øvrige: ' + rest.map(x => x[0]).join(', ') + '. Klik på Øvrige for at folde dem ud.')}
    <div class="card"><h2>Hvor gik pengene hen<small>1. jan – 30. okt 2026</small></h2>${donut(items, 'Alt forbrug')}
    <div class="foot">Klik på et stykke for at gå ned i hovedgruppen. Højst seks stykker; resten samles i Øvrige.</div></div></div>`;
} else if (S === '9') {
  // Bil as a circle, with the hover box on one piece.
  const items = top5([['Billån og afgift', 55000], ['Opladning ude', 7000], ['Bro, færge og vej', 4500], ['Bilservice', 3500], ['Opladning hjemme', 3000], ['Parkering', 1000]]);
  const total = items.reduce((s, x) => s + x[1], 0);
  html = header(['Alt forbrug', 'Bil'], 'Måned') + kpis([['Bil i perioden', kr(total), '1. jan – 30. okt 2026'], ['Billånet', Math.round(100*55000/total) + ' %', 'af alt til bilen'], ['Opladning i alt', kr(10000), 'hjemme og ude']]) +
    `<div class="grid">${list('Bil: kategorier', items, total, 'Samme farver i listen og i cirklen.')}
    <div class="card"><h2>Bil fordelt på kategorier<small>holder musen over Opladning hjemme</small></h2>${donut(items, 'Bil', [400, 8, 'Opladning hjemme', '3.000 kr. · 4 % · 31 opladninger'])}
    <div class="foot">Et stort fast beløb fylder cirklen; de små kategorier læses bedst i listen.</div></div></div>`;
} else if (S === '10') {
  // Two rings: main groups inside, their categories outside.
  const subs = {Bolig: [['Boliglån', 80000], ['El og varme', 21000], ['Vand, affald og forening', 14000]],
    Mad: [['Dagligvarer', 70000], ['Café, restaurant og take away', 23000], ['Kaffe og aftensmad fra arbejdet', 5000]],
    Bil: [['Billån og afgift', 55000], ['Opladning', 10000], ['Øvrigt til bilen', 9000]],
    Fritid: [['Ferie og rejser', 32000], ['Sport og fritid', 15000], ['Gaver', 9000]],
    'Børn': [['Institution og skole', 28000], ['Tøj og fritid', 15000]]};
  const items = top5(groups.map(g => [g[0], g[1]*10])).map(x => [x[0], x[1], x[2], subs[x[0]] || [[x[0], x[1]]]]);
  const total = items.reduce((s, x) => s + x[1], 0);
  const rows = items.map(x => x[3].map((c, k) => `<tr><td>${k ? '' : `<span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${x[2]};margin-right:6px"></span>${x[0]}`}</td><td>${c[0]}</td><td class="r">${kr(c[1])}</td><td class="r">${Math.round(100*c[1]/total)} %</td></tr>`).join('')).join('');
  html = header(['Alt forbrug'], 'Måned') +
    `<div class="grid"><div class="card"><h2>Hovedgrupper og kategorier<small>${kr(total)}</small></h2>
      <table><thead><tr><th>Hovedgruppe</th><th>Kategori</th><th class="r">Beløb</th><th class="r">Andel</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="foot">Procent af alt forbrug i perioden.</div></div>
    <div class="card"><h2>To ringe: hovedgruppe inderst, kategorier yderst<small>1. jan – 30. okt 2026</small></h2>${donut(items, 'Alt forbrug')}
    <div class="foot">Den ydre ring viser kategorierne i samme farve, lysere for hver kategori. Klik på et stykke for at gå ned.</div></div></div>`;
}
document.getElementById('page').innerHTML = html;
</script>
</body>
</html>
